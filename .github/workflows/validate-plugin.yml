name: Validate QGIS plugin package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile FlexScanQGIS/__init__.py FlexScanQGIS/plugin.py FlexScanQGIS/scan_engine.py
      - name: Build and validate plugin ZIP
        run: python scripts/package_plugin.py /tmp/GISPHN_Flexible_Scan_QGIS.zip
